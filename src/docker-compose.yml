services:
  backend:
    image: hoborg91/tgbotapiemulator-server:latest
    container_name: tgbotapiemulator-server
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5134:8080"
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    image: hoborg91/tgbotapiemulator-webgui:latest
    container_name: tgbotapiemulator-webgui
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
