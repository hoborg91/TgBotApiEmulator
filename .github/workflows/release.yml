name: Release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty for automatic versioning)"

run-name: '📌 Release build ${{ inputs.version }}'

env:
  BACKEND_IMAGE: hoborg91/tgbotapiemulator-server
  FRONTEND_IMAGE: hoborg91/tgbotapiemulator-webgui
  SOLUTION_PATH: src/TgBotApiEmulator.sln
  BACKEND_CONTEXT: src/TgBotApiEmulator
  FRONTEND_CONTEXT: src/tgbotapiemulator-webgui
  CONFIGURATION: Release
  FRONTEND_TEST_CONTEXT: src/tgbotapiemulator-webgui

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For git tag
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 100

    - name: Determine version
      if: ${{ inputs.version == '' }}
      run: |
        git fetch --depth=100 --tags
        if ! DESCR_TAG=$(git describe --tags --long 2>/dev/null); then
          VERSION="0.1"
          echo "No tags found · First release version: $VERSION"
        else
          DESCR_TAG=${DESCR_TAG#v}                  # remove the eventual 'v' prefix
          LAST_TAG=${DESCR_TAG%%-*}                 # extract the last tag
          # Split into major.minor (ignore any further segments) and bump minor
          IFS='.' read -r MAJOR MINOR _ <<< "$LAST_TAG"
          VERSION="$MAJOR.$((MINOR + 1))"
          echo Last tag: $LAST_TAG · Next version: $VERSION
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Set version from input
      if: ${{ inputs.version != '' }}
      run: |
        echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
        echo "Build version: ${{ inputs.version }}"

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build $SOLUTION_PATH --configuration $CONFIGURATION

    - name: Test (.NET)
      run: dotnet test $SOLUTION_PATH --verbosity normal --configuration $CONFIGURATION

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.x
        cache: npm
        cache-dependency-path: ${{ env.FRONTEND_TEST_CONTEXT }}/package-lock.json

    - name: Install frontend dependencies
      working-directory: ${{ env.FRONTEND_TEST_CONTEXT }}
      run: npm ci

    - name: Test (frontend GUI / Playwright)
      working-directory: ${{ env.FRONTEND_TEST_CONTEXT }}
      run: npm run test:gui
      env:
        CI: true

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Docker meta for backend
      id: meta-backend
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.BACKEND_IMAGE }}
        tags: |
          type=raw,value=${{ env.VERSION }}
          type=raw,value=latest

    - name: Build and push backend image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ env.BACKEND_CONTEXT }}
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}

    - name: Docker meta for frontend
      id: meta-frontend
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.FRONTEND_IMAGE }}
        tags: |
          type=raw,value=${{ env.VERSION }}
          type=raw,value=latest

    - name: Build and push frontend image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ env.FRONTEND_CONTEXT }}
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

    - name: Git tag
      run: |
        git tag v$VERSION
        git push --tags
